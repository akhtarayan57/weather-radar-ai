name: live-log
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/log_predictions.py
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      - run: |
          git config user.name "live-log-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live
          git diff --staged --quiet || (git commit -m "live predictions" && git push)
