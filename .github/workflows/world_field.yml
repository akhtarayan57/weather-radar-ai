name: world-field
on:
  schedule:
    - cron: "40 3,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-writes
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_world_field.py
      - run: |
          git config user.name "world-field-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live/world_field.json.gz
          git diff --staged --quiet || (git commit -m "world field" && git pull --rebase && git push)
